name: Update verified IoTKit package
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: update-iotk
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check updater integrity and ordering rules
        run: python3 -m unittest discover -s tests
      - name: Verify the public manifest and all four Homebrew archives
        run: python3 scripts/update.py
      - name: Install and test before publishing the package
        run: |
          if git diff --quiet -- Casks/iotk.rb release.json && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then exit 0; fi
          brew tap boatkit-io/tap "$GITHUB_WORKSPACE"
          cp Casks/iotk.rb "$(brew --repository boatkit-io/tap)/Casks/iotk.rb"
          brew install --cask boatkit-io/tap/iotk
          python3 scripts/smoke.py
      - name: Commit the verified package update
        run: |
          if git diff --quiet -- Casks/iotk.rb release.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/iotk.rb release.json
          git commit -m 'chore(package): update verified iotk build'
          git push origin HEAD:main
